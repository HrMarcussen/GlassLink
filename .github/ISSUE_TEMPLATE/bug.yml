name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. ...\n2. ..."
  - type: input
    id: versions
    attributes:
      label: Versions
      description: GlassLink version (System tab) and each DU's firmware (Display units tab)
      placeholder: "GlassLink 0.7.0, DU firmware 0.7.0"
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Sim, aircraft and DU hardware
      placeholder: "MSFS 2024, Fenix A320, ESP32-P4-NANO + LT8912B, 768x768 panel"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant lines of logs/dmc-<date>.log (next to config.json); remove anything private
      render: text
