# Build and test on every push and pull request. Each job runs only when its part changed, and a newer push cancels
# a running check of the same branch. The python job compiles the Python tools and the Pi viewer (the DMC is .NET).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      python: ${{ steps.filter.outputs.python }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d   # v4.0.3
        id: filter
        with:
          filters: |
            dotnet:
              - 'dotnet/**'
              - 'web/**'
              - 'VERSION'
              - 'FIRMWARE_VERSION'
              - 'config.example.json'
            python:
              - 'tools/**'
              - 'pi/**'
              - 'firmware/**/*.py'
              - 'requirements.txt'
            firmware:
              - 'firmware/**'
              - 'VERSION'

  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # git describe for the build id
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build dotnet/GlassLink.slnx -c Release -warnaserror
      - name: Test
        run: dotnet test dotnet/GlassLink.slnx -c Release --no-build --logger "console;verbosity=normal"

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile
        run: python -m compileall -q tools firmware pi

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build (ESP-IDF 5.5.5, ESP32-P4 v1.x and v3.x)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d   # v1 (its branch, 8 Nov 2024)
        with:
          esp_idf_version: v5.5.5
          target: esp32p4
          path: firmware
          command: >-
            idf.py build &&
            idf.py -B build-p4v3 -D SDKCONFIG=build-p4v3/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.p4v3" build
