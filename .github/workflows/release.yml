# Builds, signs and publishes a release when a version tag (v0.7.0) is pushed. Run it by hand (Actions, Release, Run
# workflow) for a dry run: the same build, kept as a workflow artifact, nothing published. docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (only when run on a tag)
        type: boolean
        default: false

permissions:
  contents: read                  # only the job that publishes may write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # git describe for the build id
          persist-credentials: false
      - name: Build (ESP-IDF 5.5.5, ESP32-P4, release settings)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d   # v1 (its branch, 8 Nov 2024): the image goes into the release
        with:
          esp_idf_version: v5.5.5
          target: esp32p4
          path: firmware
          # sdkconfig.release: the DU installs only signed updates. Built unsigned; the next job signs it (it has the key)
          command: idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/build/glasslink_du.bin
          if-no-files-found: error
          retention-days: 1         # only for the next job

  windows:
    needs: firmware
    runs-on: windows-latest
    environment: release            # signing secrets live here; a required reviewer approves every run
    permissions:
      contents: write               # publishes the GitHub Release
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}   # through the environment, never pasted into a script: a tag name may hold quotes
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false   # nothing here pushes; the release is published with gh and its own token
      - name: The tag is the version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$v") {
              throw "tag $env:REF_NAME but VERSION says $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: firmware/build
      - name: Sign the DU firmware
        shell: pwsh
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          # A DU running released firmware installs only updates signed with this key (firmware/sdkconfig.release).
          # The signature is checked against the public key in the repository, so a wrong secret never ships.
          if (-not $env:FIRMWARE_SIGNING_KEY) {
              if ($env:REF_TYPE -eq 'tag') { throw "FIRMWARE_SIGNING_KEY is not set: a release's DU firmware must be signed (docs/releasing.md)" }
              Write-Output "::warning title=DU firmware not signed::no FIRMWARE_SIGNING_KEY in this run: DUs running a release would refuse this image"
              exit 0
          }
          python -m pip install --disable-pip-version-check --quiet esptool==4.12.0
          $key = Join-Path $env:RUNNER_TEMP 'firmware-key.pem'
          [IO.File]::WriteAllText($key, $env:FIRMWARE_SIGNING_KEY)
          try {
              python -m espsecure sign_data --version 2 --keyfile $key --output firmware/build/glasslink_du-signed.bin firmware/build/glasslink_du.bin
              if ($LASTEXITCODE) { throw "signing failed" }
          } finally {
              Remove-Item $key -Force
          }
          python -m espsecure verify_signature --version 2 --keyfile firmware/signing-key.pub.pem firmware/build/glasslink_du-signed.bin
          if ($LASTEXITCODE) { throw "the signed firmware does not verify with firmware/signing-key.pub.pem: is FIRMWARE_SIGNING_KEY the release key?" }
          Move-Item -Force firmware/build/glasslink_du-signed.bin firmware/build/glasslink_du.bin
      - name: SimConnect.dll from build-deps
        uses: HrMarcussen/release-tools/actions/fetch-deps@v1
        with:
          token: ${{ secrets.BUILD_DEPS_TOKEN }}
          folder: GlassLink
          destination: dotnet/lib
      - name: Inno Setup
        shell: pwsh
        run: |
          # the runner image has it (6.7.1 on 2 Oct 2026); installed at a fixed version only when it is missing
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version 6.7.1 -y --no-progress }
      - name: Test
        run: dotnet test dotnet/GlassLink.slnx -c Release
      - name: Build
        shell: pwsh
        run: ./tools/build-release.ps1 -Stage publish -Strict:($env:REF_TYPE -eq 'tag')   # a tag's release must have SimConnect.dll and the firmware
      - name: Sign GlassLink.exe
        uses: HrMarcussen/release-tools/actions/sign@v1
        with:
          files: dist/GlassLink-${{ steps.version.outputs.version }}/GlassLink.exe
          method: ${{ vars.SIGN_METHOD || 'none' }}
          certum-user: ${{ secrets.CERTUM_USER }}
          certum-otp-secret: ${{ secrets.CERTUM_OTP_SECRET }}
      - name: Zip and installer
        shell: pwsh
        run: |
          ./tools/build-release.ps1 -Stage package -Strict:($env:REF_TYPE -eq 'tag')
          Copy-Item firmware/build/glasslink_du.bin "dist/glasslink_du-${{ steps.version.outputs.version }}.bin"
      - name: Sign the installer
        uses: HrMarcussen/release-tools/actions/sign@v1
        with:
          files: dist/GlassLink-${{ steps.version.outputs.version }}-setup.exe
          method: ${{ vars.SIGN_METHOD || 'none' }}
          certum-user: ${{ secrets.CERTUM_USER }}
          certum-otp-secret: ${{ secrets.CERTUM_OTP_SECRET }}
      - uses: actions/upload-artifact@v7
        with:
          name: GlassLink-${{ steps.version.outputs.version }}
          path: |
            dist/GlassLink-${{ steps.version.outputs.version }}-setup.exe
            dist/GlassLink-${{ steps.version.outputs.version }}-win-x64.zip
            dist/glasslink_du-${{ steps.version.outputs.version }}.bin
          if-no-files-found: error
          retention-days: 7         # a dry run's files; a tag's are kept by the release
      - id: notes
        if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
        uses: HrMarcussen/release-tools/actions/changelog-notes@v1
        with:
          version: ${{ steps.version.outputs.version }}
      - if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
        uses: HrMarcussen/release-tools/actions/publish-release@v1
        with:
          tag: ${{ github.ref_name }}
          title: GlassLink ${{ steps.version.outputs.version }}
          notes-file: ${{ steps.notes.outputs.file }}
          files: |
            dist/GlassLink-${{ steps.version.outputs.version }}-setup.exe
            dist/GlassLink-${{ steps.version.outputs.version }}-win-x64.zip
            dist/glasslink_du-${{ steps.version.outputs.version }}.bin
