<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="render-size" content="1280x440">
<title>GlassLink banner</title>
<!-- The README's banner. Render: powershell -File tools\render-images.ps1 banner. The displays are GlassLink's own
     drawings in the usual Airbus colours, not pictures of any aircraft add-on. -->
<style>
  @font-face { font-family: 'Inter'; src: url('../../../web/fonts/inter.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; }
  body { width: 1280px; height: 440px; background: #0f1115; color: #eceef2; font-family: 'Inter', sans-serif;
         display: flex; align-items: center; justify-content: space-between; padding: 0 56px; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand span { font-size: 64px; font-weight: 650; letter-spacing: -0.01em; }
  .tagline { font-size: 30px; font-weight: 600; margin-top: 26px; line-height: 1.2; }
  .sub { font-size: 18px; color: #a3acbd; margin-top: 14px; line-height: 1.5; max-width: 470px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .pills span { font-size: 15px; color: #c8cfdb; border: 1px solid #2c3240; border-radius: 999px; padding: 5px 13px; }
  .dus { display: flex; gap: 16px; align-items: center; }
  .du { width: 196px; height: 196px; border-radius: 18px; background: #1a1e26; border: 1px solid #2c3240;
        display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .du svg { width: 172px; height: 172px; border-radius: 6px; display: block; }
  .du:nth-child(2) { transform: translateY(-14px); }
  text { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<div>
  <div class="brand">
    <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><defs><clipPath id="logo"><rect x="2" y="2" width="60" height="60" rx="14"/></clipPath></defs><g clip-path="url(#logo)"><rect width="64" height="32" fill="#2f8fe0"/><rect y="32" width="64" height="32" fill="#8a5a2b"/><line x1="0" y1="32" x2="64" y2="32" stroke="#fff" stroke-width="3"/><line x1="12" y1="32" x2="24" y2="32" stroke="#ffd030" stroke-width="5" stroke-linecap="round"/><line x1="40" y1="32" x2="52" y2="32" stroke="#ffd030" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="32" r="3" fill="#fff"/></g></svg>
    <span>GlassLink</span>
  </div>
  <div class="tagline">Your simulator's glass cockpit,<br>on real screens.</div>
  <div class="sub">Streams the cockpit displays of MSFS 2024 to small display units over USB: one cable per screen, no extra
    graphics outputs, no extra PCs.</div>
  <div class="pills"><span>MSFS 2024</span><span>Fenix A320</span><span>FSLabs A321</span><span>Open source</span></div>
</div>
